name: docs

on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

# Required of every caller of reusable-deploy.yml, and not something that
# workflow can do for itself: concurrency groups do not cross repository
# boundaries, so each port serialises its own publishes here. `queue: max`
# runs the newest queued publish after the running one instead of cancelling
# it, and cannot be combined with cancel-in-progress. See libtmux/docs
# docs/ci.md.
concurrency:
  group: docs-deploy-${{ github.repository }}
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    outputs:
      # `publish` reaches the deploy job, which $GITHUB_ENV cannot: env vars
      # written by a step are scoped to their own job.
      publish: ${{ steps.should-publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - name: Filter changed file paths to outputs
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            root_docs:
              - CHANGES
              - README.*
            docs:
              - 'docs/**'
              - 'examples/**'
            python_files:
              - 'src/libtmux/**'
              - uv.lock
              - pyproject.toml

      - name: Should publish
        id: should-publish
        if: steps.changes.outputs.docs == 'true' || steps.changes.outputs.root_docs == 'true' || steps.changes.outputs.python_files == 'true'
        run: |
          echo "PUBLISH=true" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: env.PUBLISH == 'true'
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        if: env.PUBLISH == 'true'
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies [w/ docs]
        if: env.PUBLISH == 'true'
        run: uv sync --all-extras --dev

      - name: Install just
        if: env.PUBLISH == 'true'
        uses: extractions/setup-just@v4

      - name: Print python versions
        if: env.PUBLISH == 'true'
        run: |
          python -V
          uv run python -V

      - name: Cache sphinx fonts
        if: env.PUBLISH == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/sphinx-fonts
          key: sphinx-fonts-${{ hashFiles('docs/conf.py') }}
          restore-keys: |
            sphinx-fonts-

      # No LIBTMUX_DOCS_STANDALONE here: this tree now publishes under
      # libtmux.org at en/py/latest/, where the shell's chrome and its
      # site-wide search are reachable from the root-relative paths
      # docs/conf.py emits. Setting it would publish nested and unskinned.
      - name: Build documentation
        if: env.PUBLISH == 'true'
        run: |
          cd docs && just html

      - name: Upload the built site
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 1

  # path-prefix is unprefixed by locale: reusable-deploy prepends `<locale>/`
  # itself whenever `port` is set, so this publishes to en/py/latest/. Passing
  # en/py/latest here would produce en/en/py/latest.
  #
  # `environment` is an input rather than `environment:` on this job, which
  # `uses:` does not accept — and reusable-deploy's own job is the one whose
  # OIDC subject has to carry `environment:docs` to match the role's trust
  # policy. The three secrets are passed explicitly, never `secrets: inherit`.
  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    # Pinned to the tag reusable-deploy.yml's own header asks callers to
    # use, and bumped on review like any other dependency. Not `@main`:
    # this hands another repository execution inside ours, with
    # `id-token: write` and a role that can write the bucket.
    uses: libtmux/docs/.github/workflows/reusable-deploy.yml@v1
    with:
      path-prefix: py/latest
      artifact: docs-html
      version-kind: trunk
      port: py
      version: latest
      is-default: true
      environment: docs
    secrets:
      role-arn: ${{ secrets.LIBTMUX_DOCS_ROLE_ARN }}
      bucket: ${{ secrets.LIBTMUX_DOCS_BUCKET }}
      distribution: ${{ secrets.LIBTMUX_DOCS_DISTRIBUTION }}
