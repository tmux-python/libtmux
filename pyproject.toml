[project]
name = "libtmux"
version = "0.68.0"
description = "Typed library that provides an ORM wrapper for tmux, a terminal multiplexer."
requires-python = ">=3.11,<4.0"
authors = [
  {name = "Tony Narlock", email = "tony@git-pull.com"}
]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX",
  "Operating System :: MacOS :: MacOS X",
  "Environment :: Web Environment",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Topic :: System :: Shells",
  "Typing :: Typed",
]

keywords = ["tmux", "session manager", "terminal", "ncurses"]
homepage = "http://github.com/tmux-python/libtmux/"
readme = "README.md"
packages = [
  { include = "*", from = "src" },
]
include = [
  { path = "CHANGES", format = "sdist" },
  { path = "MIGRATION", format = "sdist" },
  { path = ".tmuxp.yaml", format = "sdist" },
  { path = "tests", format = "sdist" },
  { path = "docs", format = "sdist" },
  { path = "conftest.py", format = "sdist" },
]

[project.urls]
"Bug Tracker" = "https://github.com/tmux-python/libtmux/issues"
Documentation = "https://libtmux.git-pull.com"
Repository = "https://github.com/tmux-python/libtmux"
Changes = "https://github.com/tmux-python/libtmux/blob/master/CHANGES"

[dependency-groups]
dev = [
  # Docs (via gp-sphinx)
  "gp-sphinx==0.1.0a39",
  "sphinx-autodoc-api-style==0.1.0a39",
  "sphinx-autodoc-pytest-fixtures==0.1.0a39",
  "sphinx-autobuild",
  "types-docutils",
  # Testing
  "gp-libs>=0.0.19",
  "pytest",
  "pytest-rerunfailures",
  "pytest-mock",
  "pytest-watcher",
  "pytest-xdist",
  # Coverage
  "codecov",
  "coverage",
  "pytest-cov",
  # Lint
  "ruff>=0.17.3",
  "mypy",
  "ty>=0.0.107",
]

docs = [
  "gp-sphinx==0.1.0a39",
  "sphinx-autodoc-api-style==0.1.0a39",
  "sphinx-autodoc-pytest-fixtures==0.1.0a39",
  "sphinx-autobuild",
]
testing = [
  "gp-libs>=0.0.19",
  "pytest",
  "pytest-rerunfailures",
  "pytest-mock",
  "pytest-watcher",
]
coverage =[
  "codecov",
  "coverage",
  "pytest-cov",
]
lint = [
  "ruff>=0.17.3",
  "mypy",
  "ty>=0.0.107",
]

[project.entry-points.pytest11]
libtmux = "libtmux.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# AGENTS.md (+ its CLAUDE.md symlink) is agent guidance for contributors,
# not a package resource; hatchling's default src-layout packaging would
# otherwise ship it inside every install.
exclude = [
  "src/libtmux/AGENTS.md",
  "src/libtmux/CLAUDE.md",
]

[tool.uv.exclude-newer-package]
# git-pull packages release in lockstep with their workspaces, so a
# fresh release blocking on the 3-day cooldown blocks every
# contributor's `uv sync` until it clears. `false` exempts each
# from any `exclude-newer` constraint (global or per-user) without
# committing a date that would age into the lockfile. Mirrors the
# pattern at vcspull/pyproject.toml for libvcs.
gp-libs = false
gp-furo-theme = false
gp-sphinx = false
sphinx-autodoc-api-style = false
sphinx-autodoc-argparse = false
sphinx-autodoc-docutils = false
sphinx-autodoc-fastmcp = false
sphinx-autodoc-pytest-fixtures = false
sphinx-autodoc-sphinx = false
sphinx-autodoc-typehints-gp = false
sphinx-fonts = false
sphinx-gp-opengraph = false
sphinx-gp-llms = false
sphinx-gp-sitemap = false
sphinx-gp-theme = false
sphinx-ux-autodoc-layout = false
sphinx-ux-badges = false

[tool.mypy]
strict = true
python_version = "3.11"
files = [
  "src",
  "tests",
  "docs/_ext",
]


[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = [
  "src",
  "tests",
  "docs/_ext",
  ".github/scripts",
  "conftest.py",
]

[tool.ty.rules]
# Promote every diagnostic and opt-in check to error — https://docs.astral.sh/ty/reference/configuration/#rules
all = "error"
# Require rule codes on ty: ignore comments — https://docs.astral.sh/ty/reference/rules/#blanket-ignore-comment
blanket-ignore-comment = "error"
# Reject casts between disjoint source and target types — https://docs.astral.sh/ty/reference/rules/#disjoint-cast
disjoint-cast = "error"
# Flag static division or modulo by zero — https://docs.astral.sh/ty/reference/rules/#division-by-zero
division-by-zero = "error"
# Reject decorators that erase signatures to Any/Unknown — https://docs.astral.sh/ty/reference/rules/#dynamic-function-decorator-return
dynamic-function-decorator-return = "error"
# Reject invalid PEP 484 double-underscore positional-only names — https://docs.astral.sh/ty/reference/rules/#invalid-legacy-positional-parameter
invalid-legacy-positional-parameter = "error"
# Require sentinel names to match assigned variable names — https://docs.astral.sh/ty/reference/rules/#mismatched-sentinel-name
mismatched-sentinel-name = "error"
# Require imported third-party packages to be declared direct dependencies — https://docs.astral.sh/ty/reference/rules/#missing-direct-dependency
missing-direct-dependency = "error"
# typing.override requires Python 3.12+ (PEP 698); libtmux supports Python 3.11 with zero runtime deps — https://docs.astral.sh/ty/reference/rules/#missing-override-decorator
missing-override-decorator = "ignore"
# Require explicit type arguments on generic classes and aliases — https://docs.astral.sh/ty/reference/rules/#missing-type-argument
missing-type-argument = "error"
# Error on attribute accesses that may fail on some control-flow paths — https://docs.astral.sh/ty/reference/rules/#possibly-missing-attribute
possibly-missing-attribute = "error"
# Error on imports that may be unbound on some control-flow paths — https://docs.astral.sh/ty/reference/rules/#possibly-missing-import
possibly-missing-import = "error"
# Error on variable references that may be unbound on some paths — https://docs.astral.sh/ty/reference/rules/#possibly-unresolved-reference
possibly-unresolved-reference = "error"
# Error on conditions statically inferred as always true or false — https://docs.astral.sh/ty/reference/rules/#redundant-condition-strict
redundant-condition-strict = "error"
# Optional string and path parameters intentionally treat None and "" identically — https://docs.astral.sh/ty/reference/rules/#truthiness-test-of-none-union
truthiness-test-of-none-union = "ignore"
# Reject assigning Any/Unknown values to typed variables — https://docs.astral.sh/ty/reference/rules/#unsound-assignment
unsound-assignment = "error"
# Reject returning Any/Unknown values from typed functions — https://docs.astral.sh/ty/reference/rules/#unsound-return
unsound-return = "error"
# Reject yielding Any/Unknown values from typed generators — https://docs.astral.sh/ty/reference/rules/#unsound-yield
unsound-yield = "error"
# Reject subclassing dynamic or Any-typed base classes — https://docs.astral.sh/ty/reference/rules/#unsupported-dynamic-base
unsupported-dynamic-base = "error"


[tool.coverage.run]
branch = true
parallel = true
omit = [
  "*/_compat.py",
  "docs/conf.py",
  "tests/test_*.py",
  "tests/*/test_*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "return NotImplemented",
  "def parse_args",
  "if TYPE_CHECKING:",
  "if t.TYPE_CHECKING:",
  "@overload( |$)",
  'class .*\bProtocol\):',
  "from __future__ import annotations",
  "import typing as t",
  "^\\s*\\.\\.\\.$",
  "^\\s*pass$",
  "^\\s*assert ",
  "^\\s*logger\\s*=",
  "^import ",
  "^from .* import",
  ": TypeAlias = ",
  "= t\\.TypeVar\\(",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# `select` is deliberately unset: ruff 0.16 enables a curated default rule
# set, and an explicit `select` would replace it rather than extend it.
# `extend-select` layers this project's additional linters on top.
extend-select = [
  # pycodestyle errors — https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "E",
  # Pyflakes — https://docs.astral.sh/ruff/rules/#pyflakes-f
  "F",
  # isort import sorting — https://docs.astral.sh/ruff/rules/#isort-i
  "I",
  # pyupgrade — https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "UP",
  # flake8-builtins — https://docs.astral.sh/ruff/rules/#flake8-builtins-a
  "A",
  # flake8-annotations — https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
  "ANN",
  # flake8-bugbear — https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "B",
  # flake8-comprehensions — https://docs.astral.sh/ruff/rules/#flake8-comprehensions-c4
  "C4",
  # flake8-commas — https://docs.astral.sh/ruff/rules/#flake8-commas-com
  "COM",
  # flake8-errmsg — https://docs.astral.sh/ruff/rules/#flake8-errmsg-em
  "EM",
  # flake8-quotes — https://docs.astral.sh/ruff/rules/#flake8-quotes-q
  "Q",
  # flake8-use-pathlib — https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "PTH",
  # flake8-simplify — https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "SIM",
  # tryceratops — https://docs.astral.sh/ruff/rules/#tryceratops-try
  "TRY",
  # Perflint — https://docs.astral.sh/ruff/rules/#perflint-perf
  "PERF",
  # Ruff-specific rules — https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
  "RUF",
  # pydocstyle — https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "D",
  # Require `from __future__ import annotations` for modern type syntax — https://docs.astral.sh/ruff/rules/future-rewritable-type-annotation/
  "FA100",
]
ignore = [
  # Avoid trailing-comma rule conflicting with ruff formatter — https://docs.astral.sh/ruff/rules/missing-trailing-comma/
  "COM812",
]
extend-safe-fixes = [
  # Promote PEP 585 builtin generic rewrites to safe fixes — https://docs.astral.sh/ruff/rules/non-pep585-annotation/
  "UP006",
  # Promote PEP 604 `X | Y` union rewrites to safe fixes — https://docs.astral.sh/ruff/rules/non-pep604-annotation-union/
  "UP007",
]
pyupgrade.keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = [
  "libtmux",
]
combine-as-imports = true
required-imports = [
  "from __future__ import annotations",
]

[tool.ruff.lint.flake8-builtins]
builtins-allowed-modules = [
  "dataclasses",
  "random",
  "types",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Allow package re-exports in `__init__.py` — https://docs.astral.sh/ruff/rules/unused-import/
"*/__init__.py" = ["F401"]
"docs/conf.py" = [
  # Sphinx execs `__about__.py` so docs builds stay independent of importing libtmux — https://docs.astral.sh/ruff/rules/exec-builtin/
  "S102",
]
"src/libtmux/_internal/query_list.py" = [
  # Preserve PEP 484 `X as X` explicit re-exports for downstream type checkers — https://docs.astral.sh/ruff/rules/useless-import-alias/
  "PLC0414",
  # Lookup operators are total predicates over arbitrary caller data — https://docs.astral.sh/ruff/rules/blind-except/
  "BLE001",
]
"src/libtmux/options.py" = [
  # Option parsers log and preserve unfamiliar raw values across tmux versions — https://docs.astral.sh/ruff/rules/blind-except/
  "BLE001",
]
"src/libtmux/server.py" = [
  # `Server.is_alive` maps any unreachable-daemon failure to False — https://docs.astral.sh/ruff/rules/blind-except/
  "BLE001",
]

[tool.pytest.ini_options]
addopts = [
  "--tb=short",
  "--no-header",
  "--showlocals",
  "--doctest-docutils-modules",
  "-p no:doctest",
  "--reruns=2"
]
doctest_optionflags = [
  "ELLIPSIS",
  "NORMALIZE_WHITESPACE"
]
testpaths = [
  "src/libtmux",
  "tests",
  "docs",
  "README.md",
]
markers = [
  "integration: sphinx integration tests (require full sphinx build)",
]
