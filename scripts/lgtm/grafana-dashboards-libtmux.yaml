apiVersion: 1

# Registers the libtmux dashboard suite next to otel-lgtm's built-in providers
# (Grafana loads every *.yaml in this directory). The JSON is generated by
# scripts/lgtm/generate_dashboards.py, which up.sh runs on startup, and mounted
# read-only at the path below.
providers:
  - name: libtmux
    type: file
    folder: libtmux
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /otel-lgtm/dashboards-libtmux
      foldersFromFilesStructure: false
