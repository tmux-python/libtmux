{% extends "!page.html" %}
{%- block extrahead %}
  {{ super() }}
  {%- for href in font_preload_hrefs|default([]) %}
  <link rel="preload" href="{{ pathto('_static/fonts/' + href, 1) }}" as="font" type="font/woff2" crossorigin="">
  {%- endfor %}
  {%- if font_faces is defined and font_faces %}
  <style id="sphinx-fonts">
  {%- for face in font_faces %}
  @font-face {
    font-family: "{{ face.family }}";
    font-style: {{ face.style }};
    font-weight: {{ face.weight }};
    font-display: block;
    src: url("{{ pathto('_static/fonts/' + face.filename, 1) }}") format("woff2");
    {%- if face.unicode_range %}
    unicode-range: {{ face.unicode_range }};
    {%- endif %}
  }
  {%- endfor %}
  {%- for fb in font_fallbacks|default([]) %}
  @font-face {
    font-family: "{{ fb.family }}";
    src: {{ fb.src }};
    size-adjust: {{ fb.size_adjust }};
    ascent-override: {{ fb.ascent_override }};
    descent-override: {{ fb.descent_override }};
    line-gap-override: {{ fb.line_gap_override }};
  }
  {%- endfor %}
  body {
  {%- for var, value in font_css_variables.items() %}
    {{ var }}: {{ value }};
  {%- endfor %}
  }
  </style>
  {%- endif %}
  <link rel="manifest" href="{{ pathto('manifest.json', 1) }}">
  <link rel="icon" type="image/svg+xml" sizes="any" href="{{ pathto('_static/brand/logo.svg', 1) }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ pathto('_static/brand/logo-32.png', 1) }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ pathto('_static/brand/apple-touch-icon-light.png', 1) }}">
  <link rel="mask-icon" color="#3572A5" href="{{ pathto('_static/brand/safari-pinned-tab.svg', 1) }}">
  <meta name="theme-color" content="#3572A5">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ title|striptags|e }} | libtmux">
  <meta name="twitter:image" content="{{ brand_twitter_image|e }}">
  <meta name="twitter:image:alt" content="libtmux for Python">
{% endblock %}
